name: Build RoshdAmoz APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ساخت APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle project files not found"
            exit 1
          fi

      - name: دریافت فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: RoshdAmoz-APK
          path: app/build/outputs/apk/debug/*.apk
